name: validation

on:
  pull_request:
    branches: [main]
  push: 
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: event_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4 

      - name: "setup rust"
        uses: dtolnay/rust-toolchain@stable

      - name: "cache dependencies"
        uses: Swatinem/rust-cache@v2

      - name: "run tests"
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/event_management_test
        run: cargo test
