name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY_HOST: gateway.tail9a6ddb.ts.net
      REGISTRY: gateway.tail9a6ddb.ts.net:5000
      IMAGE_NAME: aura-event-management

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Docker metadata"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: "Require semantic version tags"
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: test -n "$IMAGE_TAGS"

      # HTTP transport stays inside the encrypted tailnet.
      - name: "Allow the tailnet registry over HTTP"
        shell: bash
        run: |
          current=$(sudo cat /etc/docker/daemon.json 2>/dev/null || true)
          [[ -n "$current" ]] || current='{}'
          jq --arg registry "$REGISTRY" '."insecure-registries" = ((."insecure-registries" // []) + [$registry] | unique)' <<< "$current" \
            | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker

      # Use the daemon's registry configuration for building and pushing.
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      # Complete the build before allowing access to the tailnet.
      - name: "Build image"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: "Join the tailnet"
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_OAUTH_AUDIENCE }}
          tags: tag:ci
          ping: ${{ env.REGISTRY_HOST }}

      - name: "Login to registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: "Push image"
        run: docker push --all-tags "$REGISTRY/$IMAGE_NAME"

  release:
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "setup rust"
        uses: dtolnay/rust-toolchain@stable

      - name: "cache dependencies"
        uses: Swatinem/rust-cache@v2

      # Generate the API contract for this release.
      - name: "Generate openapi def"
        run: cargo run --bin generate_openapi

      # Attach the contract after the container has been published.
      - name: "Release"
        uses: softprops/action-gh-release@v2
        with:
          files: openapi.yml
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
