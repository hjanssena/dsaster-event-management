[package]
name = "eventManagement_api"
version = "0.1.0"
edition = "2024"

[dependencies]
# Framework web y asincronía
axum = "0.7"
tokio = { version = "1.1", features = ["full"] }

# ORM (Ajusta "sqlx-postgres" a "sqlx-mysql" si una bd es mysql)
sea-orm = { version = "1.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# Serialización y utilidades
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
thiserror = "1.0"
